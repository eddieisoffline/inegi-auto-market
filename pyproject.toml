[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inegi-auto-market"
version = "0.1.0"
description = "Mercado automotriz de México con datos del INEGI (RAIAVL) y Banxico: ingesta, capas raw/curated, conciliación y pronóstico"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.16"]
bigquery = ["google-cloud-bigquery>=3.20"]
# Warehouse local: el mismo SQL de BigQuery ejecutado en DuckDB sobre el lake local.
local = ["duckdb>=1.1", "sqlglot>=25"]
dev = ["pytest>=8.0", "ruff>=0.6", "duckdb>=1.1", "sqlglot>=25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inegi_market = ["sql/*.sql", "sql/seeds/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
