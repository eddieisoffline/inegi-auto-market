[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inegi-auto-market"
version = "0.2.0"
description = "Mercado automotriz de México con datos del INEGI (RAIAVL) y Banxico: ingesta de publicaciones, capa curated con contratos, conciliación, diff entre publicaciones, warehouse en BigQuery y pronóstico"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["INEGI", "RAIAVL", "Banxico", "México", "data pipeline", "BigQuery", "pronóstico"]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "statsmodels>=0.14",
]

[project.urls]
Repositorio = "https://github.com/eddieisoffline/inegi-auto-market"
Dashboard = "https://datastudio.google.com/reporting/cda06336-ca03-4f2f-9e40-a6b301ee36d2"
Changelog = "https://github.com/eddieisoffline/inegi-auto-market/blob/main/CHANGELOG.md"

[project.scripts]
inegi-market = "inegi_market.cli:main"

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.16"]
bigquery = ["google-cloud-bigquery>=3.20"]
# Warehouse local: el mismo SQL de BigQuery ejecutado en DuckDB sobre el lake local.
local = ["duckdb>=1.1", "sqlglot>=25"]
dev = ["pytest>=8.0", "ruff>=0.6", "duckdb>=1.1", "sqlglot>=25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inegi_market = ["sql/*.sql", "sql/seeds/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
